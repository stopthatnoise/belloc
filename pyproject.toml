[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "belloc"
version = "0.1.0"
description = "Беларускія пераклады гульняў і інструменты для іх"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[project.optional-dependencies]
lint = ["spylls==0.1.7"]                                   # hunspell без праграмы hunspell (Windows)
unity = ["UnityPy==1.25.4", "numpy==2.5.4", "Pillow", "fonttools"]   # fonttools — дынамічныя TTF
glacier = ["lz4", "numpy==2.5.4"]                          # .rpkg: LZ4 і XTEA масівам
unreal = ["pyooz", "pycryptodome", "fonttools"]           # .pak: Oodle, AES; кірыліца ў шрыфты
telltale = ["numpy==2.5.4", "Pillow", "texture2ddecoder", "etcpak", "opencv-python-headless"]
                                                          # шрыфты і тэкстуры: BC1/BC3, inpaint
release = ["pyinstaller==6.22.3"]                          # belloc package: усталёўшчык .exe

[tool.setuptools.packages.find]
where = ["core"]
